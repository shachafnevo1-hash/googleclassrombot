<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>04 · Bauhaus</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root { --paper: #EEE4CE; --red: #D9301F; --yellow: #F3B21B; --blue: #1E4E9C; --ink: #161514; }
  html, body { margin: 0; background: var(--paper); }
  .poster { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--paper); color: var(--ink); }
  .abs { position: absolute; }
  svg.abs { left: 0; top: 0; }

  .one { left: 70px; top: 228px; font: 800 900px/1 Jost; color: var(--ink); letter-spacing: -0.04em; direction: ltr; }
  .tap { left: 56px; top: 34px; font: 700 236px/1 Jost; letter-spacing: -0.05em; direction: ltr; }
  .he { right: 60px; top: 74px; direction: rtl; text-align: right; }
  .he .a span { display: inline-block; font: 900 70px/1 Rubik; letter-spacing: -0.01em; padding: 6px 18px 12px; color: var(--paper); }
  .he .a span.r { background: var(--red); }
  .he .a span.k { background: var(--ink); margin-top: 8px; margin-right: 46px; }
  .he .b { margin-top: 22px; font: 500 25px/1.35 Heebo; }

  #product { left: 500px; bottom: 308px; height: 660px; }

  .sq { left: 60px; top: 1100px; width: 196px; height: 196px; background: var(--red); color: var(--paper);
    display: flex; align-items: flex-end; justify-content: flex-end; box-sizing: border-box; padding: 18px; direction: rtl;
    font: 700 96px/1 Jost; text-align: right; letter-spacing: -0.04em; }
  .info { left: 300px; right: 60px; top: 1112px; direction: rtl; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 26px; }
  .info div { border-top: 6px solid var(--ink); padding-top: 14px; font: 500 24px/1.25 Heebo; }
  .info b { display: block; font: 600 17px/1 Jost; letter-spacing: .14em; direction: ltr; text-align: right; margin-bottom: 10px; text-transform: lowercase; }
  .label { font: 500 16px/1 Jost; letter-spacing: .3em; text-transform: lowercase; direction: ltr; }

  .grain { inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .5; }
</style>
</head>
<body>
<div class="poster">
  <!-- geometry: Kandinsky's Bauhaus triad - blue circle, yellow triangle, red square -->
  <svg class="abs" width="1080" height="1350" viewBox="0 0 1080 1350">
    <polygon points="440,1042 1050,1042 745,352" fill="var(--yellow)"/>
    <line x1="-20" y1="1010" x2="1100" y2="372" stroke="var(--ink)" stroke-width="5"/>
    <circle cx="300" cy="640" r="236" fill="var(--blue)"/>
  </svg>

  <div class="abs one">1</div>
  <div class="abs tap">tap</div>

  <svg class="abs" width="1080" height="1350" viewBox="0 0 1080 1350">
    <rect x="60" y="1042" width="960" height="30" fill="var(--ink)"/>
    <circle cx="300" cy="640" r="236" fill="none" stroke="var(--ink)" stroke-width="0"/>
  </svg>

  <img class="abs" id="product" alt="">

  <div class="abs he">
    <div class="a"><span class="r">ושימו</span><br><span class="k">דירוג!</span></div>
    <div class="b">טאפ אחד עם הטלפון —<br>ודף הביקורת בגוגל נפתח.</div>
  </div>

  <div class="abs label" style="left:62px; top:1080px">nfc · review · stand</div>
  <div class="abs sq" style="direction:ltr">5★</div>
  <div class="abs info">
    <div><b>01</b>מצמידים את הטלפון</div>
    <div><b>02</b>דף הביקורת נפתח</div>
    <div><b>03</b>★★★★★</div>
  </div>

  <svg class="abs grain" viewBox="0 0 1080 1350" preserveAspectRatio="none">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .33  0 0 0 -1.5 1.1"/></filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>
</div>

<script type="module">
import { loadImage, fonts, done, PRODUCT } from './common.js';
await fonts(['800 900px Jost', '700 236px Jost', '600 17px Jost', '900 74px Rubik', '800 42px Rubik', '500 25px Heebo']);
document.getElementById('product').src = (await loadImage(PRODUCT)).src;
done();
</script>
</body>
</html>
